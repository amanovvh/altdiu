# Nginx reverse proxy for the lyceum site.
# Place at /etc/nginx/sites-available/lyceum.conf and symlink to sites-enabled.
# Assumes:
#   - DNS A record points your domain to this server
#   - certbot ran successfully (see deploy/nginx/README.md)
#   - the app listens on 127.0.0.1:3000

# Rate limit zone (shared with the second server block below)
limit_req_zone $binary_remote_addr zone=lyceum_ratelimit:10m rate=30r/s;

# ──────────────── HTTP → HTTPS redirect ────────────────
server {
    listen 80;
    listen [::]:80;
    server_name lyceum.example.com www.lyceum.example.com;

    # Let's Encrypt ACME challenge must be served over HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Redirect everything else to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ──────────────── HTTPS ────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lyceum.example.com www.lyceum.example.com;

    # SSL certificates (managed by certbot).
    ssl_certificate     /etc/letsencrypt/live/lyceum.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lyceum.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers (additional — most are set by Next.js already).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "origin-when-cross-origin" always;

    # Gzip.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # Uploaded media cache (long).
    location ~* ^/uploads/.*\.(jpg|jpeg|png|webp|avif|gif|svg)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Static assets.
    location ~* ^/(?:_next|favicon\.ico|logo\.jpeg|og-image\.[a-z]+|hero-bg\.jpeg)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Proxy everything else to Next.js.
    location / {
        limit_req zone=lyceum_ratelimit burst=50 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support (Next.js devtools, future features).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # File upload size — match Next.js form limits.
        client_max_body_size 12m;

        # Long timeouts for slow admin actions.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
