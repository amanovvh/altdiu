services:
  postgres:
    image: postgres:16-alpine
    container_name: lyceum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lyceum_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strong_password}
      POSTGRES_DB: ${POSTGRES_DB:-lyceum_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lyceum_user} -d ${POSTGRES_DB:-lyceum_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Expose only to the app network; not directly to the host.
    expose:
      - "5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lyceum-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-lyceum_user}:${POSTGRES_PASSWORD:-strong_password}@postgres:5432/${POSTGRES_DB:-lyceum_db}?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      ADMIN_DEFAULT_EMAIL: ${ADMIN_DEFAULT_EMAIL}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD}
      ADMIN_DEFAULT_NAME: ${ADMIN_DEFAULT_NAME:-Site Administrator}
    volumes:
      # Persist uploads across container restarts/rebuilds
      - uploads_data:/app/public/uploads
    # Expose to host for Nginx reverse proxy
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  uploads_data:
